<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kola docs — developer documentation</title>
  <meta name="description" content="Kola's developer documentation: authentication, Errands, webhooks, channels, and rate limits.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Root-relative, deliberately. A bare "styles.css" resolves against
       the CURRENT path, so a hard load of a nested route requests
       /section/main.dart.js, gets index.html back from the SPA fallback,
       and renders blank. See kola_dashboard/web/index.html for the full
       diagnosis. -->
  <link rel="stylesheet" href="/styles.css">

  <script defer src="/main.dart.js"></script>
</head>
<body>
  <!-- Jaspr client-mode renders into #app -->
  <div id="app"></div>
</body>
</html>
