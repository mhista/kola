name: kola_admin
description: Kola's internal control plane — separate app, separate auth, separate deploy. See docs/ADMIN_APP_SPEC.md.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.8.0

# ─────────────────────────────────────────────────────────────────────────────
# jaspr: mode: client — same confirmed pattern as kola_dashboard/kola_landing
# (DEVELOPMENT_PLAN.md Phase 4a's decision), reused here rather than
# reconsidered, per ADMIN_APP_SPEC.md §4: "Stack: Jaspr mode: client,
# matching every other frontend in this project."
#
# NO supabase package, and no Google Identity Services either — unlike
# kola_dashboard, this app does NOT authenticate against Supabase Auth
# at all. Admin identity is deliberately separate (see
# admin_auth_service.dart's header in kola_server) — this app calls
# client.adminAuth.login(email, password) over kola_client, gets back a
# signed admin session token, and sends that token as a plain parameter
# on every subsequent call, exactly like kola_dashboard sends its
# Supabase access token.
# ─────────────────────────────────────────────────────────────────────────────

resolution: workspace

dependencies:
  jaspr: ^0.23.2
  jaspr_router: ^0.9.0
  # LOCAL PATH, same reasoning as kola_dashboard's own dependency on it
  # (see that pubspec's header) — kola_client is regenerated by
  # `serverpod generate` every time an endpoint or model changes, and a
  # git ref would compile against whatever was last pushed rather than
  # what a local build just generated.
  kola_client:
    path: ../kola_client
  # window.localStorage, for persisting the admin session token across
  # a page reload — same use as kola_dashboard's local_storage.dart.
  web: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.0
  build_web_compilers: ^4.0.0
  jaspr_builder: ^0.23.0
  lints: ^6.1.0

jaspr:
  mode: client
