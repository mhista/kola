name: _
publish_to: none

environment:
  sdk: '^3.8.0'

workspace:
  - kola_client
  - kola_server
  - kola_flutter
  # Added in Phase 4e — kola_dashboard now path-depends on kola_client
  # (see kola_dashboard/pubspec.yaml's header), which requires joining
  # this workspace since kola_client itself uses `resolution: workspace`
  # (same reason kola_flutter is listed above, not a new pattern).
  - kola_dashboard
  # kymaa_dashboard — the frozen competition build, recovered from git
  # HEAD. Listed here for exactly the same reason kola_dashboard is: its
  # pubspec declares `resolution: workspace`, and a package that says
  # that MUST have a workspace root above it or `dart pub get` refuses
  # to run at all.
  #
  # Being a workspace member does not couple it to the redesign — they
  # share no source, only dependency resolution.
  - kymaa_dashboard
  # kola_admin — the internal control plane (ADMIN_APP_SPEC.md), a
  # separate Jaspr app path-depending on kola_client, same requirement
  # as kola_dashboard above.
  - kola_admin
