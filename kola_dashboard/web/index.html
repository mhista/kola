<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kolaa — Dashboard</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Root-relative, same reasoning as styles.css/main.dart.js below —
       a relative favicon href breaks on a hard load of a nested route. -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- Phase 11g-a — PWA shell. manifest.json makes the app installable
       (DESIGN_BRIEF_COMMERCE.md §4: "no hardware to buy, no app store"
       — installing straight from the browser IS the store here).
       theme-color matches KolaDark bg (see lib/theme.dart) so the
       browser/OS chrome around an installed window doesn't clash with
       the app's own background the instant it opens. Root-relative for
       the same reason every other asset on this page is — see the
       styles.css/main.dart.js comment below on why a relative path
       breaks on a hard load of a nested route. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121214">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Space Grotesk (display) + Plus Jakarta Sans (UI) + IBM Plex Mono.
       Inter is gone as of the redesign — see lib/theme.dart. This href
       must stay identical to KolaFonts.googleFontsHref; the fonts are
       the single most visible difference between an old screen and a
       new one, so a mismatch here is immediately obvious but easy to
       misdiagnose as a component bug. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ROOT-RELATIVE, and it must stay that way.
       These were `href="styles.css"` and `src="main.dart.js"`, with no
       leading slash. That works on `/` and breaks on every nested route.

       This is a client-routed SPA, so a hard load of /bots/3 — a refresh,
       a pasted link, a Back that leaves the app — serves index.html from
       that path. The browser then resolves a RELATIVE asset against
       /bots/, requesting /bots/main.dart.js. The SPA fallback answers
       that with index.html, so the browser receives HTML where it expects
       JavaScript, the script never runs, and the page renders blank.

       Diagnosed from the dev server log, which showed exactly this:
         GET /bots/3           304
         GET /bots/styles.css  304
         GET /bots/main.dart.js 304

       It looks like a routing bug and is not one. In-app navigation works
       because the assets were already loaded from `/`; only a hard load
       of a nested path fails. The leading slash is the whole fix. -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Google Identity Services — loaded here rather than dynamically
       injected from Dart, since it must be present before
       google_identity.dart's JS interop calls google.accounts.id.*.
       See that file's header for why this dashboard talks to Google
       directly instead of redirecting through Supabase's own
       /auth/v1/authorize. -->
  <script src="https://accounts.google.com/gsi/client" async></script>

  <script defer src="/main.dart.js"></script>

  <!-- Phase 11g-a — registers sw.js (see that file's own header for
       the caching strategy). Deliberately plain, un-deferred inline JS
       rather than something routed through Dart/Jaspr: registration
       must fire on every load regardless of whether main.dart.js has
       finished (or ever finishes, on a bad connection) loading — the
       whole point of a service worker is to be the thing that's
       already there before the app needs it. Guarded on
       'serviceWorker' in navigator for the handful of browsers
       (older Safari, non-Chromium mobile browsers) that don't support
       it: those users simply don't get offline support, they don't
       get an error. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Kola: service worker registration failed', err);
        });
      });
    }
  </script>
</head>
<body>
  <!-- Jaspr client-mode renders into #app -->
  <div id="app"></div>
</body>
</html>
