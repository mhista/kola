<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="font-family:'Plus Jakarta Sans',sans-serif;background:#121214;color:#F3EEE7;width:100%;min-height:100vh;box-sizing:border-box;padding:32px 40px;background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1.4px, transparent 1.4px);background-size:24px 24px">
  <a href="Kola%20Dashboard%20Shell.dc.html" style="color:#9C9691;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:14px">← Dashboard</a>
  <div style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin-bottom:24px">Billing &amp; Plans</div>

  <div style="background:linear-gradient(135deg,#241A14,#1B1B1E);border:1px solid #3A2A1E;border-radius:18px;padding:24px;margin-bottom:28px;max-width:900px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
    <div>
      <div style="font-size:13px;color:#E9A87C;font-weight:600;margin-bottom:6px">TRIAL — 9 DAYS LEFT</div>
      <div style="font-size:19px;font-weight:600">You're on Pro, free until August 3</div>
    </div>
    <button style="background:#C1552E;color:#FFF6EE;border:none;border-radius:100px;padding:11px 20px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">Add payment method</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin-bottom:36px">
    <sc-for list="{{ usage }}" as="u" hint-placeholder-count="3">
      <div style="background:#1B1B1E;border:1px solid #2C2A28;border-radius:14px;padding:18px">
        <div style="font-size:13px;color:#9C9691;margin-bottom:10px">{{ u.label }}</div>
        <div style="font-size:20px;font-weight:600;margin-bottom:10px">{{ u.value }} <span style="font-size:13px;color:#6B655E;font-weight:400">/ {{ u.max }}</span></div>
        <div style="height:6px;border-radius:100px;background:#2A2622;overflow:hidden">
          <div style="height:100%;width:{{ u.pct }}%;background:#C1552E;border-radius:100px"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="font-size:15.5px;font-weight:600;margin-bottom:16px">Plans</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin-bottom:36px;align-items:stretch">
    <sc-for list="{{ plans }}" as="p" hint-placeholder-count="3">
      <div style="background:#1B1B1E;border:1.5px solid {{ p.border }};border-radius:16px;padding:22px;position:relative;display:flex;flex-direction:column">
        <sc-if value="{{ p.current }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:-11px;left:20px;background:#1F6F54;color:#D6F3E6;font-size:11px;font-weight:600;padding:4px 12px;border-radius:100px">Current plan</div>
        </sc-if>
        <div style="font-size:16px;font-weight:600;margin-bottom:12px">{{ p.name }}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin-bottom:16px">{{ p.price }}<span style="font-size:13px;color:#6B655E;font-weight:400"> /mo</span></div>
        <div style="flex:1">
          <sc-for list="{{ p.features }}" as="f" hint-placeholder-count="4">
            <div style="font-size:13px;color:#B9B3AC;padding:6px 0;border-top:1px solid #241F1B">✓ {{ f }}</div>
          </sc-for>
        </div>
        <button style="width:100%;margin-top:16px;border:none;border-radius:100px;padding:11px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:{{ p.ctaBg }};color:{{ p.ctaColor }}">{{ p.cta }}</button>
      </div>
    </sc-for>
  </div>

  <div style="font-size:15.5px;font-weight:600;margin-bottom:16px">Invoices</div>
  <div style="border:1px solid #2C2A28;border-radius:14px;overflow:hidden;max-width:900px">
    <sc-for list="{{ invoices }}" as="inv" hint-placeholder-count="3">
      <div style="display:grid;grid-template-columns:140px 1fr 100px 90px;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid #1F1D1B;background:#1B1B1E;font-size:13.5px">
        <div style="border-top:none">{{ inv.date }}</div><div style="color:#9C9691">{{ inv.desc }}</div><div>{{ inv.amount }}</div>
        <a href="#" style="color:#E9A87C;text-align:right">Download</a>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      usage: [
        { label: 'Messages this month', value: '3,214', max: '10,000', pct: 32 },
        { label: 'Errand calls', value: '1,880', max: '5,000', pct: 38 },
        { label: 'Documents', value: '6', max: '20', pct: 30 },
      ],
      plans: [
        { name: 'Free', price: '₦0', features: ['5 conversations/day', '1 bot'], ctaBg: '#1F1D1B', ctaColor: '#D8D2C9', cta: 'Downgrade' },
        { name: 'Pro', price: '₦45,000', features: ['Unlimited conversations', '5 bots', 'Custom Errands'], current: true, border: '#C1552E', ctaBg: '#2A2622', ctaColor: '#6B655E', cta: 'Current plan' },
        { name: 'Business', price: '₦120,000', features: ['Everything in Pro', 'Unlimited bots', 'Team seats', 'API & webhooks'], ctaBg: '#C1552E', ctaColor: '#FFF6EE', cta: 'Upgrade' },
      ].map(p => ({ ...p, border: p.border || '#2C2A28' })),
      invoices: [
        { date: 'Jul 1, 2026', desc: 'Pro plan — monthly', amount: '₦45,000' },
        { date: 'Jun 1, 2026', desc: 'Pro plan — monthly', amount: '₦45,000' },
        { date: 'May 1, 2026', desc: 'Pro plan — monthly', amount: '₦45,000' },
      ],
    };
  }
}

</script>
</body>
</html>
