<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="font-family:'Plus Jakarta Sans',sans-serif;background:#121214;color:#F3EEE7;width:100%;min-height:100vh;box-sizing:border-box;padding:32px 40px;background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1.4px, transparent 1.4px);background-size:24px 24px">
  <a href="Kola%20Dashboard%20Shell.dc.html" style="color:#9C9691;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:14px">← Dashboard</a>
  <div style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin-bottom:6px">Integrations</div>
  <div style="font-size:14.5px;color:#9C9691;margin-bottom:28px">Connect the channels and tools your bot uses.</div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:900px">
    <sc-for list="{{ cards }}" as="card" hint-placeholder-count="5">
      <div style="background:#1B1B1E;border:1px solid #2C2A28;border-radius:16px;padding:22px;display:flex;flex-direction:column;min-height:190px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:12px;min-width:0">
            <div style="width:38px;height:38px;border-radius:10px;background:{{ card.iconBg }};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">{{ card.icon }}</div>
            <div style="font-size:15.5px;font-weight:600">{{ card.name }}</div>
          </div>
          <sc-if value="{{ card.soon }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:11px;font-weight:600;background:#2A2622;color:#B9B3AC;padding:4px 10px;border-radius:100px;white-space:nowrap;flex-shrink:0">Coming soon</span>
          </sc-if>
          <sc-if value="{{ card.connected }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:11px;font-weight:600;background:#12261F;color:#7ED8B0;padding:4px 10px;border-radius:100px;white-space:nowrap;flex-shrink:0">Connected</span>
          </sc-if>
        </div>
        <div style="font-size:13.5px;color:#9C9691;line-height:1.5;flex:1">{{ card.desc }}</div>
        <div style="margin-top:16px">
          <button style="background:{{ card.btnBg }};color:{{ card.btnColor }};border:none;border-radius:100px;padding:10px 18px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer">{{ card.btnLabel }}</button>
        </div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  cardDefs = [
    { name: 'WhatsApp', icon: '💬', iconBg: '#12261F', desc: 'Connected to +234 803 221 9910 — automating customer conversations.', connected: true, btnBg: '#1F1D1B', btnColor: '#D8D2C9', btnLabel: 'Manage connection' },
    { name: 'Telegram', icon: '✈️', iconBg: '#1B2430', desc: 'Not connected yet — no phone number required, live in minutes.', btnBg: '#C1552E', btnColor: '#FFF6EE', btnLabel: 'Connect Telegram' },
    { name: 'Paystack', icon: '💳', iconBg: '#241A14', desc: 'Accept payments and confirm orders automatically inside chats. Payment infrastructure is ready — launching in a future update.', soon: true, btnBg: '#2A2622', btnColor: '#6B655E', btnLabel: 'Notify me' },
    { name: 'Flutterwave', icon: '💳', iconBg: '#241A14', desc: 'Accept payments and confirm orders automatically inside chats. Payment infrastructure is ready — launching in a future update.', soon: true, btnBg: '#2A2622', btnColor: '#6B655E', btnLabel: 'Notify me' },
    { name: 'Facebook Catalog', icon: '📘', iconBg: '#1B2430', desc: 'Sync your product catalog for richer WhatsApp shopping replies.', soon: true, btnBg: '#2A2622', btnColor: '#6B655E', btnLabel: 'Notify me' },
  ];
  renderVals() { return { cards: this.cardDefs }; }
}

</script>
</body>
</html>
