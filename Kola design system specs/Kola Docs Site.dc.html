<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="font-family:'Instrument Sans',sans-serif;background:#FAF6EF;color:#1C1815;width:100%;min-height:100vh;box-sizing:border-box">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid #E8E1D6">
    <div style="display:flex;align-items:center;gap:24px">
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 26 26" fill="none"><path d="M13 2C13 2 6 8.5 6 15.5C6 20 9 24 13 24C17 24 20 20 20 15.5C20 8.5 13 2 13 2Z" fill="#C1552E"/></svg>
        <span style="font-family:'Newsreader',serif;font-size:18px;font-weight:600">kola docs</span>
      </div>
      <span style="font-size:13px;background:#F1EAE0;color:#6B655E;padding:4px 10px;border-radius:100px">v1.2</span>
    </div>
    <input placeholder="Search docs..." style="width:260px;background:#FFFFFF;border:1px solid #E8E1D6;border-radius:100px;padding:9px 16px;font-size:13.5px;font-family:inherit"/>
  </div>

  <div style="display:flex;max-width:1300px;margin:0 auto">
    <div style="width:230px;flex-shrink:0;padding:28px 20px;border-right:1px solid #E8E1D6">
      <sc-for list="{{ navGroups }}" as="grp" hint-placeholder-count="4">
        <div style="margin-bottom:22px">
          <div style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:#9C9691;margin-bottom:8px">{{ grp.title }}</div>
          <sc-for list="{{ grp.items }}" as="it" hint-placeholder-count="3">
            <div onClick="{{ it.onClick }}" style="font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer;color:{{ it.color }};background:{{ it.bg }};font-weight:{{ it.weight }}">{{ it.label }}</div>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <div style="flex:1;padding:36px 40px;max-width:720px">
      <div style="font-family:'Newsreader',serif;font-size:32px;font-weight:600;margin-bottom:14px">{{ activeTitle }}</div>
      <div style="font-size:15.5px;color:#4A443F;line-height:1.7;margin-bottom:24px">{{ activeIntro }}</div>

      <sc-if value="{{ isChannelsGuide }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ walkthroughSteps }}" as="ws" hint-placeholder-count="6">
          <div style="display:flex;gap:16px;margin-bottom:24px">
            <div style="width:28px;height:28px;border-radius:50%;background:#1C1815;color:#F3EEE7;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">{{ ws.n }}</div>
            <div>
              <div style="font-size:15px;font-weight:600;margin-bottom:6px">{{ ws.title }}</div>
              <div style="font-size:14px;color:#6B655E;line-height:1.6;margin-bottom:10px">{{ ws.body }}</div>
              <div style="background:#F1EAE0;border:1px dashed #D8CDBB;border-radius:10px;padding:14px;font-size:13px;color:#9C7A5A">📷 Screenshot placeholder — real capture pending</div>
            </div>
          </div>
        </sc-for>
      </sc-if>

      <sc-if value="{{ isQuickstart }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:10px;margin-bottom:16px">
          <sc-for list="{{ codeTabs }}" as="ct" hint-placeholder-count="3">
            <div onClick="{{ ct.onClick }}" style="font-size:13px;font-weight:600;padding:7px 14px;border-radius:100px;cursor:pointer;background:{{ ct.bg }};color:{{ ct.color }}">{{ ct.label }}</div>
          </sc-for>
        </div>
        <pre style="background:#1C1815;color:#9BE6C7;border-radius:12px;padding:20px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;overflow-x:auto">{{ activeCode }}</pre>
      </sc-if>
    </div>

    <div style="width:200px;flex-shrink:0;padding:36px 20px;font-size:13px;color:#9C9691">
      <div style="text-transform:uppercase;letter-spacing:0.04em;font-size:11.5px;margin-bottom:12px">On this page</div>
      <div style="padding:5px 0">Overview</div>
      <div style="padding:5px 0">Authentication</div>
      <div style="padding:5px 0">Example request</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: 'quickstart', codeTab: 'curl' };

  navDefs = [
    { title: 'Getting started', items: ['Quickstart', 'Authentication'] },
    { title: 'Core', items: ['Errands', 'Webhooks'] },
    { title: 'Channels', items: ['WhatsApp', 'Telegram', 'Connect your WhatsApp'] },
    { title: 'Reference', items: ['Rate limits & plans', 'SDKs'] },
  ];

  pageContent = {
    quickstart: { title: 'Quickstart', intro: 'Get your first Errand running against a live bot in under five minutes.' },
    'connect your whatsapp': {
      title: 'Connect your WhatsApp', intro: 'A plain-language walkthrough of linking a WhatsApp Business number to kola, step by step.',
      walkthrough: [
        { n: 1, title: 'Log into Facebook', body: 'You\'ll be taken to Meta\'s own sign-in screen — this is expected and safe.' },
        { n: 2, title: 'Review permissions', body: 'Meta shows what kola is requesting access to.' },
        { n: 3, title: 'Accept the opt-in scope', body: 'Confirm you want to connect a WhatsApp Business number.' },
        { n: 4, title: 'Choose your business asset', body: 'Select or create the Meta Business asset to link.' },
        { n: 5, title: 'Pick your phone number', body: 'Choose the number you\'ll dedicate to this bot.' },
        { n: 6, title: 'Wait for business verification', body: 'This can take from minutes to a couple of days depending on Meta.' },
      ],
    },
  };

  codeSamples = {
    curl: `curl https://api.kola.dev/errands \\\n  -H "Authorization: Bearer sk_live_..." \\\n  -d '{ "trigger": "order.status" }'`,
    dart: `final res = await kola.errands.create(\n  trigger: 'order.status',\n);`,
    js: `await kola.errands.create({\n  trigger: 'order.status',\n});`,
  };

  renderVals() {
    const key = this.state.page;
    const content = this.pageContent[key] || this.pageContent.quickstart;
    return {
      navGroups: this.navDefs.map(g => ({
        title: g.title,
        items: g.items.map(label => {
          const active = label.toLowerCase() === key;
          return { label, onClick: () => this.setState({ page: label.toLowerCase() }), color: active ? '#C1552E' : '#4A443F', bg: active ? '#F1EAE0' : 'transparent', weight: active ? 600 : 400 };
        }),
      })),
      activeTitle: content.title, activeIntro: content.intro,
      isChannelsGuide: key === 'connect your whatsapp',
      isQuickstart: key === 'quickstart',
      walkthroughSteps: content.walkthrough || [],
      codeTabs: ['curl', 'dart', 'js'].map(t => ({ label: t, onClick: () => this.setState({ codeTab: t }), bg: t === this.state.codeTab ? '#1C1815' : '#F1EAE0', color: t === this.state.codeTab ? '#F3EEE7' : '#4A443F' })),
      activeCode: this.codeSamples[this.state.codeTab],
    };
  }
}

</script>
</body>
</html>
