<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Kept in step with the hero by hand, because it cannot be generated:
       this file is static, and the headline lives in i18n/strings.dart
       behind a locale the server has not resolved yet. The old copy here
       ("say it, kolaa builds the bot") outlived the repositioning by a
       whole release — it was still what search results and link previews
       said long after the page itself had stopped saying it. -->
  <title>kolaa — turn your business data into decisions</title>
  <meta name="description" content="kolaa remembers what your business knows, watches what changes, and tells you what to do about it — on WhatsApp, Telegram and the web.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Root-relative, deliberately. A bare "styles.css" resolves against
       the CURRENT path, so a hard load of a nested route requests
       /section/main.dart.js, gets index.html back from the SPA fallback,
       and renders blank. See kola_dashboard/web/index.html for the full
       diagnosis. -->
  <link rel="stylesheet" href="/styles.css">

  <!-- script.js exposes DOM helpers Dart calls via js_interop; must load before the Dart bundle -->
  <script src="script.js"></script>
  <script defer src="/main.dart.js"></script>
</head>
<body>
  <!-- Jaspr client-mode renders into #app -->
  <div id="app"></div>
</body>
</html>
