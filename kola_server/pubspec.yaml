name: kola_server
description: Kola Bot-as-a-Service platform — Serverpod Mini server (codegen + endpoints only; Supabase owns persistence, see lib/src/services/repository).
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

# ─────────────────────────────────────────────────────────────────────────────
# Package selection rationale (Phase 1 — server foundation)
#
#  serverpod    – Lightweight Dart HTTP server. No Postgres ORM (we use
#                 Supabase for persistence — see SRS.md §2), but gives us
#                 the full endpoint/model codegen pipeline, generated client,
#                 and Relic as the underlying web server for raw routes.
#
#  supabase     – Dart-native Supabase client. We own the schema; Serverpod
#                 models are the source of truth for shapes, DTOs bridge
#                 the gap (see lib/src/services/dto/base_dto.dart).
#
#  envied       – Type-safe environment variables, obfuscated at compile
#                 time so secrets don't sit in plaintext in a shipped
#                 binary. Same pattern already proven in degenbot_server.
#
#  get_it       – Simple service-locator DI. Used to wire repositories and
#                 (from Phase 2 onward) messaging/AI services without
#                 endpoints reaching for globals directly.
#
#  logging      – Standard Dart logging, piped into kola_logger.dart's
#                 Talker + Serverpod-session dual output.
#
#  talker       – Colored console logging backend for kola_logger.dart —
#                 reused from Asami/Degenbot rather than reinvented.
#
#  dart_jsonwebtoken – Verifies Supabase Auth JWTs sent by the dashboard
#                 (session_verifier.dart). We never issue tokens ourselves;
#                 Supabase Auth stays the single identity source of truth.
#                 Same package already used in the copycat/kopicat_server
#                 reference project's Relic-based API layer.
#
#  pointycastle – AES-256-GCM primitives for
#                 channel_credential_encryption_service.dart (Phase 2a) —
#                 same package Degenbot's wallet_encryption_service.dart
#                 already uses for the identical algorithm, reused rather
#                 than reinvented.
#
#  televerse    – Telegram Bot API client (Phase 2a). Same package already
#                 battle-tested in degenbot_server's telegram_service.dart;
#                 Kola instantiates one per connected Telegram Channel
#                 instead of one global bot — see
#                 lib/src/services/messaging/telegram/telegram_service.dart's
#                 header comment for why that's a safe reuse, not a rewrite.
#
#  mailer       – SMTP email sending (Phase 3's owner-escalation-notification
#                 feature). Same package + Message/Address/SmtpServer/send()
#                 usage already proven in asami_server's
#                 email_notification_service.dart — reused technique, not
#                 the specific e-commerce templates, which don't apply here.
#
#  http         – Already imported directly by whatsapp_service.dart and the
#                 AI provider clients (groq/gemini/openrouter) — added here
#                 explicitly as a direct dependency (was resolving
#                 transitively before) when webhook_errand_executor.dart
#                 (Phase 3c) became the fourth file to need it.
#
#  crypto       – SHA-256 for Phase 9's knowledge-document content hashing
#                 (document_ingestion_service.dart), the dedupe check that
#                 runs BEFORE anything is embedded — see that file's header
#                 on why the order matters. Promoted from a transitive to a
#                 direct dependency for exactly the same reason `http` was
#                 below: it's now imported directly by our own code, so it
#                 should be declared rather than relied on by accident.
#                 NOT pointycastle (already present, and does have SHA-256):
#                 pointycastle is the heavyweight primitives library this
#                 project uses for AES-256-GCM key material, and `crypto`'s
#                 one-line `sha256.convert(...)` is the plainer tool for a
#                 plain hash.
#
#  postgres     – PostgreSQL driver for Phase 3c's dbCredential Errand type
#                 (SRS.md §7.2): a business supplies their own Postgres
#                 connection string, an Errand runs exactly one pre-approved
#                 named-parameter query template against it via
#                 Sql.named(...) — never open SQL, never string-concatenated
#                 queries. MySQL support (also listed in SRS.md §7.2) is
#                 deliberately deferred — a separate driver/executor, not an
#                 extension of this one.
# ─────────────────────────────────────────────────────────────────────────────

dependencies:
  # Reading .xlsx, which is a ZIP of XML. See xlsx_extractor.dart — the
  # alternative was refusing every spreadsheet an owner has, and a price
  # list in Excel is the single most common thing a shop actually holds.
  archive: ^4.0.0
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  envied: ^1.3.5
  get_it: ^9.2.1
  http: ^1.6.0
  logging: ^1.3.0
  mailer: ^7.2.0
  pointycastle: ^4.0.0
  postgres: ^3.5.12
  serverpod: 3.4.11
  supabase: ^2.13.0
  talker: ^5.1.17
  televerse: ^3.5.2

dev_dependencies:
  build_runner: ^2.15.0
  envied_generator: ^1.3.5
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.11
  test: ^1.25.5

serverpod:
  scripts:
    # Serverpod Mini has no ORM-managed database (Supabase is persistence —
    # see supabase_client.dart's header), so there's nothing for
    # --apply-migrations to do here; that flag is a full-Serverpod-only
    # concept. Schema changes are hand-applied SQL against Supabase (see
    # docs/migrations/) — this is just the plain entrypoint, same command
    # degenbot_server documents for local dev.
    start: dart bin/main.dart

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\kola_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\kola_server\web\app
      posix: |
        cd ../kola_flutter
        flutter build web --base-href /app/ --wasm --output ../kola_server/web/app

