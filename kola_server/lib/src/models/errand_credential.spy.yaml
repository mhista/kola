##
## errand_credential.spy.yaml — Encrypted connection details for a
## webhook/dbCredential/mcp-backed Errand (SRS.md §6, §7.1).
##
## Kept as its OWN table (one row per Errand, 1:1 via the unique index on
## errandId below) rather than a column inline on Errand — unlike
## Channel's encryptedCredential (channel.spy.yaml), which IS inline —
## because different fulfillment types need structurally different
## credential shapes (a webhook URL + optional auth header vs. a database
## connection string + approved query templates vs. an MCP server URL +
## auth), and SRS.md §6 already designed it as a distinct model. A
## 'builtin' Errand never gets a row here at all — nothing to connect to.
##
## encryptedCredential holds ciphertext produced by the SAME AES-256-GCM
## service already used for Channel and Telegram bot tokens
## (channel_credential_encryption_service.dart) — same algorithm, same key
## requirements, reused rather than reinvented, per SRS.md §6's own note
## ("same pattern, different secret class"). The plaintext underneath is a
## JSON blob whose shape depends on the owning Errand's `source` — a
## webhook Errand's plaintext looks like
## {"url": "...", "authHeader": "..."}, a dbCredential Errand's looks like
## {"connectionString": "...", "queryTemplates": [...]} — that shape isn't
## encoded in this model at all, only wherever an errand_credential.dart
## equivalent to whatsapp_credential.dart gets built when Phase 3c
## actually implements webhook/dbCredential fulfillment.
##

class: ErrandCredential
# table: errand_credentials
fields:
  id: int? # Supabase assigns this automatically

  # Foreign key → errands.id — enforced 1:1 via the unique index below.
  errandId: int

  encryptedCredential: String

  createdAt: DateTime
  updatedAt: DateTime

indexes:
  errand_credential_errand_idx:
    fields: errandId
    unique: true
