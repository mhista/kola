##
## workspace.spy.yaml — Workspace: the tenant root (PRD.md §5, SRS.md §5/§6)
##
## Every business that signs up gets exactly one Workspace. Every other
## domain model (Bot, Channel, Errand, KnowledgeDocument, ...) is scoped to
## a workspaceId — this is the multi-tenant isolation boundary. Enforced
## at two layers: the repository layer (every query below filters by
## workspaceId explicitly — see workspace_repository.dart) and, later,
## Supabase Row Level Security as a defense-in-depth backstop.
##
## Serverpod generates the shape; Supabase owns the actual row (see
## WorkspaceDto for the fromRow/toRow mapping and the table schema).
## `#table:` stays commented out deliberately — see server.dart's header
## comment for why (Serverpod Mini pattern, SRS.md §2).
##
## TRIAL MODEL (PRD.md §10) — the three trial timestamps below implement
## the two-stage trial as explicit, queryable dates rather than scattered
## date-math: trialFullAccessEndsAt is the 48-hour full-Pro-access cutover,
## trialEndsAt is the day-14 pause point. A workspace's effective plan at
## any moment is derived by comparing `now` against these two dates plus
## the `plan`/`status` fields — see Phase 5's trial state machine.
##

class: Workspace
# table: workspaces
fields:
  id: int? # Supabase assigns this automatically

  # Business-facing name shown throughout the dashboard and to end customers
  # (e.g. as the bot's introduction: "You're chatting with <name>").
  name: String

  # Free-text-ish industry tag used for onboarding personalization and,
  # later, cohort analytics (e.g. 'fashion_retail', 'food_logistics').
  # Nullable because a business can skip this during signup.
  industryTag: String?

  ## The name kola greets the owner with and signs messages as, captured
  ## in the create-workspace wizard (migration 027).
  ##
  ## NOT a login identity — that is Supabase auth — and not a per-member
  ## display name. If team members ever get their own names those belong
  ## on workspace_members; this stays as the business's owner-of-record.
  ownerName: String?

  # Billing plan. Values: 'free' | 'pro' | 'business' (PRD.md §10).
  plan: String

  # Workspace lifecycle status. Values:
  #   'trialing'  — inside the 48h/14d trial window
  #   'active'    — paying, fully live
  #   'paused'    — trial expired without payment; data retained, bot silent
  status: String

  # When the trial started — always set at workspace creation.
  trialStartedAt: DateTime

  # 48-hour mark: full Pro-tier feature access ends here, workspace steps
  # down to the capped free-tier feature set (PRD.md §6/§10).
  trialFullAccessEndsAt: DateTime

  # Day-14 mark: workspace is paused (not deleted) if still unpaid.
  trialEndsAt: DateTime

  # Which market this workspace is in — ISO-3166 alpha-2, or 'XX' for
  # the international default.
  #
  # Selects the Pro-plan price, its currency, and which of KOLA'S OWN
  # gateway accounts collects it (see plan_pricing.dart). Kola prices per
  # region at rough purchasing-power parity rather than converting one
  # figure: a number that works in Lagos is trivial in London, and a
  # number that works in London is impossible in Lagos.
  #
  # Defaults to 'NG' — every workspace that exists today is Nigerian, and
  # that is the only commercially settled price. An unknown value
  # resolves to the international tier rather than failing, so a market
  # nobody anticipated can still pay.
  region: String

  # PHASE 10 (Release Control). True for Kola's own dogfooding
  # workspaces. Read by FeatureFlagService when a feature is in
  # 'internal' state — the stage between "built" and "shown to a single
  # customer", where the team runs a new feature against real data
  # before anyone outside sees it.
  #
  # Settable ONLY from kola_admin, never from the customer dashboard or
  # any customer-reachable endpoint — a workspace that could mark itself
  # internal could unlock every unreleased feature on the platform,
  # which would make the entire release-control system decorative.
  # Defaults false; migration 018 backfills every existing row to false.
  isInternal: bool

  # The till's VAT rate, in basis points (750 = 7.5%) — migration
  # 035_sales.sql added this column when the sales counter's schema was
  # written, but it was never added to this model, so SaleEndpoint could
  # not read it (compile error: "The getter 'taxRateBps' isn't defined
  # for the type 'Workspace'"). Fixed here rather than worked around,
  # since the column has existed on every workspace since migration 035
  # — this was a gap in the model, not in the data. DEFAULT 0: a shop
  # that is not VAT-registered must not start charging it because a
  # field got added. See migration 035's own header for the full
  # reasoning.
  taxRateBps: int

  # Gate 7 (migration 045) — "does this business sell things people can
  # order from a catalog?" Null means never asked; that keeps today's
  # behavior (catalog nag shown, Products card shown) for every existing
  # workspace. True/false only after an owner has actually answered, in
  # Settings. See migration 045's header on why this is one boolean, not
  # the direction doc's broader multi-value "workspace profile" — nothing
  # in this codebase reads a profile for anything beyond the catalog
  # surface yet.
  sellsCatalogItems: bool?

  createdAt: DateTime
  updatedAt: DateTime

indexes:
  workspace_status_idx:
    fields: status
