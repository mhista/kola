##
## channel.spy.yaml — A connected messaging channel for a Bot.
##
## One Bot can have multiple Channels (e.g. Telegram now, WhatsApp once
## Meta approval clears — META_CONNECT_FLOW.md). Credentials are stored
## encrypted; encryptedCredential holds ciphertext produced by the same
## AES-256-GCM approach already implemented for wallet keys in Degenbot
## (wallet_encryption_service.dart) — reused, not reinvented, per the
## working convention. The encryption service itself is wired in Phase 2
## once there's a real credential (bot token / WABA phone number ID) to
## protect; the column exists now so the schema doesn't need a later
## migration just to add it.
##

class: Channel
# table: channels
fields:
  id: int? # Supabase assigns this automatically

  # Foreign key → bots.id
  botId: int

  # Which messaging platform this channel connects to.
  # Values: 'telegram' | 'whatsapp' (META_CONNECT_FLOW.md, SRS.md §9).
  platformType: String

  # Human-readable identifier shown in the dashboard — a Telegram @handle
  # or the connected WhatsApp phone number, formatted for display only.
  displayName: String?

  # Encrypted channel credential (Telegram bot token, or WhatsApp
  # long-lived access token from Embedded Signup). Null until the owner
  # actually completes the connect flow for this channel. Wired up in
  # Phase 2 — see channel.spy.yaml header comment above.
  encryptedCredential: String?

  # Connection lifecycle. Values:
  #   'pending'      — channel row created, connect flow not yet completed
  #   'connected'    — live, receiving/sending real messages
  #   'disconnected' — was connected, now broken (expired token, revoked
  #                    access) — surfaced by the nightly credential health
  #                    check (SRS.md §13)
  status: String

  createdAt: DateTime
  updatedAt: DateTime

  ## ── CONNECTOR CONTRACT (migration 036, Gate 1) ───────────────────────
  ##
  ## See docs/Kolaa_Connections_Backbone_Direction_v5.pdf PART III and
  ## kola_server/lib/src/services/connectors/contract/.

  ## Adapter-opaque watermark (contract/sync_types.dart's SyncCursor),
  ## JSON-encoded when an adapter needs more than one field. Close to
  ## vestigial for WhatsApp/Telegram today — both are push-driven, so
  ## there is no "page" to resume from — and becomes load-bearing once a
  ## pull-based adapter (Gate 4) needs somewhere to persist one.
  syncCursor: String?

  ## When ChannelHealthCheckService last actually attempted this
  ## channel, regardless of outcome. Distinct from updatedAt, which also
  ## changes on an unrelated edit (a display name rename) and so cannot
  ## answer "when did we last actually check."
  lastHealthCheckAt: DateTime?

  ## RetentionPolicy.retainOnDisconnect | .deleteOnDisconnect — what
  ## should happen to this channel's conversations/messages if the
  ## workspace disconnects it. Nullable here so ChannelRepository.create's
  ## existing direct `Channel(...)` construction doesn't need updating
  ## for a field the database already defaults — see migration 036's
  ## `not null default 'retain_on_disconnect'`. Treat a null here as
  ## retainOnDisconnect, matching the existing, already-shipped behavior
  ## of ChannelRepository.markDisconnected, which has never deleted a
  ## message — this column makes that an explicit, documented policy
  ## rather than an accident of how markDisconnected happened to be
  ## written.
  retentionPolicy: String?

indexes:
  channel_bot_idx:
    fields: botId
