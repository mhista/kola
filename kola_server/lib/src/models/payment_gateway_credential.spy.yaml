##
## payment_gateway_credential.spy.yaml — Task #127 / Phase 8a: a
## workspace's OWN Paystack or Flutterwave secret key, so a bot's "collect
## payment" Errand can charge that business's OWN customers into that
## business's OWN gateway account.
##
## WHY THIS EXISTS SEPARATELY FROM Env.paystackSecretKey/flutterwaveSecretKey
## (dependency_injection.dart's existing global PaystackService/
## FlutterwaveService registrations): those two remain exactly what Phase
## 5c built them for — Kola's OWN gateway account, for Kola charging a
## workspace ITS Kola subscription fee, once that billing flow is wired up.
## This model is the opposite direction of money: a workspace's customer
## paying THAT WORKSPACE, with Kola never touching the funds. Same
## distinction PayPal/Stripe Connect draw between "platform account" and
## "connected account" — Kola only ever has the platform side; this table
## is what makes the connected side real, one row per (workspaceId, gateway).
##
## Deliberately modeled on Channel's own encryptedCredential column, not
## Asami's order_escrow/vendor-wallet system — see DEVELOPMENT_PLAN.md
## Phase 8a's header for why Asami's full marketplace-wallet pattern
## doesn't fit here. encryptedCredential holds ciphertext from the SAME
## ChannelCredentialEncryptionService every other credential in this
## codebase already reuses (Telegram bot token, WhatsApp access token,
## webhook/dbCredential Errand secrets) — the plaintext underneath is
## just the gateway secret key string, no JSON wrapping needed since
## there's only ever one field to protect here.
##

class: PaymentGatewayCredential
# table: payment_gateway_credentials
fields:
  id: int? # Supabase assigns this automatically

  # Foreign key → workspaces.id
  workspaceId: int

  # 'paystack' | 'flutterwave' — one row per (workspaceId, gateway); a
  # workspace may connect both if it wants to offer either at checkout.
  gateway: String

  # AES-256-GCM ciphertext of the plaintext secret key, via
  # ChannelCredentialEncryptionService — never the public key, and never
  # logged or returned to any client.
  encryptedSecretKey: String

  # FLUTTERWAVE ONLY (null for paystack): Flutterwave's webhook
  # verification is a plain string comparison against a SEPARATE
  # "secret hash" the business sets themselves in their own Flutterwave
  # dashboard (Settings > Webhooks) — see flutterwave_service.dart's
  # header. It is NOT derived from encryptedSecretKey and NOT optional
  # once a business wants Flutterwave webhooks to actually confirm
  # payments rather than sit permanently 'pending'. Paystack needs no
  # equivalent field — its webhook signature is an HMAC over the SAME
  # secret key already stored above.
  encryptedWebhookSecret: String?

  # Gate 11 (breadth), MONNIFY ONLY (null for every other gateway):
  # Monnify's auth model needs an apiKey AND a secretKey together (Basic
  # base64(apiKey:secretKey) on its login call — see monnify_service
  # .dart's header) — neither one is a substitute for the other the way
  # Paystack/Flutterwave/Stripe's single secret key is. This is a
  # genuinely SECOND required credential, not an optional add-on the way
  # [encryptedWebhookSecret] is for Flutterwave, which is why it gets its
  # own column rather than overloading that one — a future gateway
  # needing a second credential reuses this field too, whatever it's
  # actually called on that gateway's side.
  encryptedApiKey: String?

  createdAt: DateTime
  updatedAt: DateTime

  # Gate 4 (migration 040) — the pull-based sync engine's watermark and
  # last-attempt timestamp. Null on every row created before this
  # migration, and on any row nothing has synced yet. See migration
  # 040's header for why this lives here rather than a new table.
  syncCursor: String?
  lastSyncedAt: DateTime?

indexes:
  payment_gateway_credential_workspace_gateway_idx:
    fields: workspaceId, gateway
    unique: true
