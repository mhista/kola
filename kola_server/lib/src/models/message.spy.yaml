##
## message.spy.yaml — Individual inbound/outbound message within a
## Conversation (SRS.md §6's Core Domain Model table: "reused shape from
## Asami's Message/MessageType, extended with a generic platform-
## agnostic MediaType/button/list model already defined in
## IMessagingService"). Kept deliberately plain for this pass — just
## enough to render a message thread and know who sent what — not yet
## carrying buttons/lists/media, which stay a Phase 4+ dashboard concern
## once there's an actual reason to render them richly.
##

class: Message
# table: messages
fields:
  id: int? # Supabase assigns this automatically

  # Foreign key → conversations.id
  conversationId: int

  # 'inbound' (from the customer) | 'outbound' (to the customer).
  direction: String

  # Who/what produced this message. Values:
  #   'customer' — always paired with direction: 'inbound'
  #   'bot'      — an automatic reply (grounded Q&A or, before Phase 3,
  #                the Phase 2 hardcoded canned reply)
  #   'human'    — a business owner/staff member typed this via
  #                ConversationEndpoint.sendHumanReply, always paired
  #                with direction: 'outbound'
  #   'api'      — Gate 8: sent by an external caller via the public
  #                POST /v1/messages endpoint (an API key, not a person
  #                at the keyboard), always paired with direction:
  #                'outbound'. Kept distinct from 'human' — the design
  #                already draws that same "person vs. programmatic
  #                caller" line for API keys elsewhere (see
  #                api_key.spy.yaml).
  senderType: String

  body: String

  ## ── INBOUND MEDIA (migration 032) ──────────────────────────────────
  ##
  ## Until this existed, a customer who sent a photo produced a Message
  ## with an empty body and nothing else — the image was dropped on the
  ## floor. For a shop where "do you have this?" is answered by sending a
  ## picture, that is the most important message type there is.
  ##
  ## The bytes do NOT arrive here the way dashboard uploads do. WhatsApp
  ## and Telegram hand the webhook a media REFERENCE, not a file, and
  ## fetching it needs that channel's own credentials — so the server
  ## downloads and re-uploads to ImageKit. See
  ## ImageKitService.uploadBytes for why ImageKit cannot fetch the
  ## provider URL itself.
  ##
  ## 'image' | 'video' | 'audio' | 'document'. Null for plain text.
  mediaKind: String?

  ## The permanent ImageKit URL.
  ##
  ## NULLABLE EVEN WHEN mediaKind IS SET, and that combination is
  ## meaningful: the customer sent a file and kola could not store it.
  ## The message is still real, still routed, still shown — the owner
  ## sees that something was sent rather than seeing nothing. Losing a
  ## customer's message because a CDN was briefly unreachable would be
  ## far worse than losing the picture.
  mediaUrl: String?

  mediaThumbnailUrl: String?

  ## Needed to delete the asset if a conversation is ever purged.
  mediaImagekitFileId: String?

  ## What the provider said it was. Kept because 'image' does not
  ## distinguish a photo from a screenshot of a receipt, and the
  ## difference matters to what kola should do next.
  mediaMimeType: String?

  createdAt: DateTime

  ## ── PROVENANCE + IDEMPOTENCY (migration 036, Gate 1) ─────────────────
  ##
  ## The contract's "provenance on every record" (source, source ID,
  ## fetched-at, permission scope) applied to inbound messages — see
  ## docs/Kolaa_Connections_Backbone_Direction_v5.pdf PART III.
  ##
  ## 'whatsapp' | 'telegram' | null. Null for a human-typed reply or the
  ## bot's own outbound text — those don't come from an external source.
  sourcePlatform: String?

  ## WhatsApp's wamid or Telegram's message id. THIS IS WHAT MAKES
  ## WEBHOOK REPLAY IDEMPOTENT — migration 036's unique index on
  ## (conversationId, externalMessageId) means the same inbound payload
  ## delivered twice produces one row, not two (Postgres treats every
  ## NULL as distinct from every other NULL, so outbound/human messages
  ## with no external id are never mistaken for duplicates of each
  ## other). Null for anything not sourced from an external platform
  ## event.
  externalMessageId: String?

  ## When kola actually received this, as opposed to createdAt (when the
  ## row was written) — the two are usually the same instant for a
  ## webhook-delivered message, but kept distinct because a future
  ## replayed/backfilled ingestion could write a row well after the
  ## event actually happened, and the contract asks for fetched-at
  ## specifically, not just created-at.
  fetchedAt: DateTime?

  ## The permission scope this message was read/received under —
  ## currently always 'workspace' (a connected channel's full inbox is
  ## visible to the owning workspace), kept as a field rather than a
  ## hardcoded assumption because a future connector (Level 3, a
  ## business's own system) may read under a narrower scope the
  ## reasoning layer needs to respect.
  permissionScope: String?

indexes:
  message_conversation_idx:
    fields: conversationId
  message_conversation_external_id_idx:
    fields: conversationId, externalMessageId
    unique: true
